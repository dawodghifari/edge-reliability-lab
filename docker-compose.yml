# Local dev stack: the edge-cache service + Redis. This is the Phase 0 target —
# run it before moving to Kubernetes.
#
#   docker compose up --build
#   curl localhost:8000/segment/abc   # first time: X-Cache: MISS
#   curl localhost:8000/segment/abc   # again:      X-Cache: HIT
#   curl localhost:8000/metrics
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trace backend for local work, so you can see waterfalls without a cluster.
  # Tempo has no UI of its own — query it from Grafana, or just confirm spans are
  # arriving in its logs. In the cluster this is installed via Helm instead.
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./k8s/tempo-local.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP receiver
      - "3200:3200"   # Tempo query API

  edge-cache:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: edge-cache:dev
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CHAOS_ENABLED: "true"
      SEGMENT_TTL_SECONDS: "60"
      ORIGIN_LATENCY_SECONDS: "0.15"
      # Tracing on locally. Sample every request — there's no load here to skew,
      # and you want to see the waterfall for the request you just made.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      TRACE_SAMPLE_RATIO: "1.0"
      DEPLOYMENT_ENV: compose
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
