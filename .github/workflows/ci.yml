name: CI

# Lint and test the service, unit-test the alert rules, validate the manifests and
# Terraform, and build the image, on every push and PR. None of it needs a cluster.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check app

      - name: Run tests (pytest)
        run: python -m pytest -q

  alerts:
    name: Alert rule tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # promtool runs from the pinned Prometheus image; PyYAML extracts the rule
      # groups from the PrometheusRule manifest.
      - name: promtool check + test rules
        run: |
          pip install pyyaml
          bash scripts/test-alerts.sh

  infra:
    name: Manifests & Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: kubeconform + terraform validate
        run: bash scripts/validate-infra.sh

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the edge-cache image
        run: docker build -t edge-cache:dev app
