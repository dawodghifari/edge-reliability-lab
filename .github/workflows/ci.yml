name: CI

# Lint, test, and build the edge-cache image on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app

      - name: Run tests (pytest)
        run: python -m pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the edge-cache image
        run: docker build -t edge-cache:dev app
